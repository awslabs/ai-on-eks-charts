# Default values for inference-charts
# This is a YAML-formatted file.

global:
  # Common settings across all inference types
  image:
    pullPolicy: IfNotPresent

  # Common resource settings
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi

fluentbit:
  image:
    repository: fluent/fluent-bit
    tag: 3.2.2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi

vllm:
  loadFormat: # runai_streamer
  logLevel: debug
  port: 8004
  # CPU backend (accelerator: graviton) KV cache sizing.
  # On the CPU backend, vLLM sizes the KV cache via VLLM_CPU_KVCACHE_SPACE (absolute GiB),
  # NOT --gpu-memory-utilization (which the CPU backend measures against the whole node's
  # RAM, making it unsafe when the pod's cgroup limit is smaller than the node).
  # The chart injects VLLM_CPU_KVCACHE_SPACE for graviton + vllm deployments.
  #   - cpuKvCacheSpace set   -> used verbatim (GiB)
  #   - cpuKvCacheSpace empty -> derived as floor(graviton memory request in GiB * cpuKvCacheUtilization)
  # The memory REQUEST is used (not the limit) because the CPU backend sizes the KV cache
  # against node free RAM; the request is guaranteed and never exceeds node allocatable.
  # cpuKvCacheUtilization is the CPU analogue of GPU --gpu-memory-utilization: the fraction of
  # the pod's memory request devoted to the KV cache; the remainder covers weights + runtime.
  cpuKvCacheSpace: # explicit KV cache size in GiB; empty = auto-derive from the graviton memory request
  cpuKvCacheUtilization: 0.7 # fraction of the graviton memory request used for the KV cache

# llama.cpp (framework: llama-cpp) settings
llamaCpp:
  # Command used to launch the server. Defaults to the binary on PATH.
  # The official ggml-org image runs it from the workdir, so use "./llama-server" there.
  command: llama-server

# Extra labels applied to all resources (pods, deployments, services, etc.)
extraLabels: {}

# The name of the model from Hugging Face
model: NousResearch/Llama-3.2-1B

# Optional: path to the model weights (local path or S3 path).
# When set, this is used as the first argument to the engine (e.g. vllm serve <modelPath>)
# and "model" is passed as --served-model-name instead.
modelPath:

# Model parameters to the inference engine
modelParameters:

# Inference configuration
inference:
  serviceName: inference
  serviceNamespace: default

  # Accelerator type: gpu, neuron, or graviton
  # graviton runs on ARM64 CPU instances (no GPU/Neuron device plugin), e.g. llama.cpp or CPU vLLM builds.
  accelerator: gpu

  # Framework type: vllm, ray-vllm, triton-vllm, aibrix, lws-vllm, or llama-cpp
  framework:

  #Ray Specific Options
  rayOptions:
    rayVersion: 2.47.0
    # Ray native autoscaling configuration
    autoscaling:
      enabled: false
      # Ray autoscaler specific settings
      upscalingMode: "Default"
      idleTimeoutSeconds: 60  # How long to wait before scaling down idle nodes
      actorAutoscaling:
        minActors: 1
        maxActors: 1
    gcs:
      highAvailability:
        enabled: false
        redis:
          address: redis.redis
          port: 6379
          secretName:
          secretPasswordKey:
    observability:
      rayPrometheusHost: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
      rayGrafanaHost: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
      rayGrafanaIframeHost: http://localhost:3000

  modelServer:
    image:
      repository: vllm/vllm-openai
      tag: latest
    deployment:
      replicas: 1
      maxReplicas: 2
      minReplicas: 1
      sharedMemory: 1Gi
      resources:
        gpu:
          requests:
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
        neuron:
          requests:
            aws.amazon.com/neuron: 1
          limits:
            aws.amazon.com/neuron: 1
        # Graviton (ARM64 CPU) has no device-plugin resource; request CPU/memory only.
        graviton:
          requests:
            cpu: 4
            memory: 8Gi
          limits:
            cpu: 8
            memory: 16Gi
      # NIM Container-specific configuration (NVIDIA Inference Microservices)
      # These are default values that can be overridden in model-specific values files
      nimContainer:
        # Common NIM environment variables
        env:
          NVIDIA_VISIBLE_DEVICES: "all"
          NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
          NIM_CACHE_PATH: "/opt/nim/.cache"

        # Run as non-root user (required for NIM containers - do not comment out)
        # NIM images are built to run as UID 1000 with pre-configured library paths
        # Running as root will cause CUDA library loading failures
        podSecurityContext:
          fsGroup: 1000
          runAsUser: 1000
          runAsGroup: 1000

        # Shared memory configuration
        shm:
          enabled: true
          medium: Memory
          sizeLimit: 1Gi

        # Health probes - common endpoints for NIM
        livenessProbe:
          httpGet:
            path: /v1/health/live
            port: 8000
          initialDelaySeconds: 900  # Default for smaller models
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /v1/health/ready
            port: 8000
          initialDelaySeconds: 900  # Default for smaller models
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3

        # NGC and HuggingFace secrets
        secrets:
          ngcApiKey:
            name: ngc-api
            key: NGC_API_KEY
          hfToken:
            name: hf-token
            key: HF_TOKEN
      # Topology constraints for pod scheduling
      topologySpreadConstraints:
        enabled: true
        # Default constraints for Ray deployments:
        # 1. Prefer workers in same AZ as head (soft constraint)
        # 2. Require workers to be grouped together (hard constraint)
        constraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels: {} # Will be populated with deployment labels
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels: {} # Will be populated with worker-specific labels
      # Pod affinity for Karpenter - helps with node provisioning decisions
      podAffinity:
        enabled: true
        # Strong preference for same AZ (helps Karpenter understand intent)
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels: {} # Will be populated with deployment labels
      startupProbe:
        failureThreshold: 60
        periodSeconds: 10
        httpGet:
          path: /health
          port: 8000
    env: {}

s3ModelCopy:
  model: # HuggingFace model name or path (e.g. meta-llama/Meta-Llama-3-8B)
  s3Bucket: # S3 bucket name (e.g. my-bucket)
  s3Prefix: # S3 key prefix (default: s3ModelCopy.model)
  namespace:
  # HuggingFace token secret configuration.
  # Option 1 (default): secretKeyRef — mounts a single key from the secret as HF_TOKEN env var.
  # Option 2: envFrom — loads all keys from the secret as env vars (secret must contain HF_TOKEN key).
  hfTokenSecret:
    name: hf-token # Name of the Kubernetes secret
    key: token # Key within the secret containing the token (used when envFrom: false)
    envFrom: false # Set to true to use envFrom (secret must have HF_TOKEN as a key)
  nodeSelector: {} # e.g. {node.kubernetes.io/instance-type: "m5.4xlarge"}
  tolerations: [] # e.g. [{key: "nvidia.com/gpu", operator: "Exists", effect: "NoSchedule"}]
  # Storage size for ephemeral disk (used as ephemeral-storage request/limit and
  # as the Gt threshold for NVMe node affinity when requireLocalNvme is true).
  # Specify as an integer in GB.
  storageSize: 100
  # When requireLocalNvme is true, the chart automatically adds nodeAffinity rules
  # requiring nodes with NVMe storage > storageSize (in GB).
  # Uses Gt operator on both karpenter.k8s.aws/instance-local-nvme and
  # eks.amazonaws.com/instance-local-nvme labels (OR'd). Merges with any
  # user-provided affinity below.
  requireLocalNvme: false
  # When requireNetworkBandwidth is set to a value (in Mbps), the chart automatically
  # adds nodeAffinity rules requiring nodes with network bandwidth > that value.
  # Uses Gt operator on both karpenter.k8s.aws/instance-network-bandwidth and
  # eks.amazonaws.com/instance-network-bandwidth labels (OR'd). Merges with any
  # user-provided affinity below.
  requireNetworkBandwidth: # Minimum network bandwidth in Mbps (e.g. 25000). Empty to disable.
  # Additional affinity rules for pod scheduling. Merged with auto-generated NVMe
  # affinity when requireLocalNvme is true.
  affinity: {}
  terminationGracePeriodSeconds: 120 # Time to allow graceful shutdown before SIGKILL
  serviceAccountName: # serviceAccountName to be used for model uploading to S3
  env: [] # Extra env vars, e.g. [{name: "HTTP_PROXY", value: "http://proxy:3128"}]
  # Memory usage depends on transfer mode and concurrency settings.
  # In stream mode, memory ≈ fileWorkers × downloadWorkers × downloadChunkSize (MB).
  #
  # In xet mode, hf_xet uses internal download buffers controlled by env vars.
  # HF_XET_HIGH_PERFORMANCE=1 (enabled by default in xet mode) raises these significantly:
  #
  #   Env Variable                                           | Default | HP Mode
  #   ------------------------------------------------------|---------|--------
  #   HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE            | 2GB     | 16GB
  #   HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE    | 512MB   | 2GB
  #   HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT           | 8GB     | 64GB
  #   HF_XET_RECONSTRUCTION_MIN_RECONSTRUCTION_FETCH_SIZE   | 256MB   | 1GB
  #   HF_XET_RECONSTRUCTION_MAX_RECONSTRUCTION_FETCH_SIZE   | 8GB     | 16GB
  #   HF_XET_RECONSTRUCTION_TARGET_BLOCK_COMPLETION_TIME    | 15m     | —
  #   HF_XET_RECONSTRUCTION_MIN_PREFETCH_BUFFER             | 1GB     | —
  #
  # With HP mode enabled, the download buffer limit alone is 64GB.
  # Set memory requests/limits accordingly, or override these via s3ModelCopy.env.
  # See: https://huggingface.co/docs/hub/en/xet/using-xet-storage#download-buffers
  #
  # Ephemeral Storage (xet mode):
  # In xet mode, files are downloaded to local disk (tempDir) before uploading to S3.
  # Disk usage ≈ max_file_size × fileWorkers (files are deleted after upload).
  # For large models (e.g. 70B+ params), individual shard files can be 5-10GB each,
  # so with fileWorkers=4 you may need 40GB+ of ephemeral storage.
  # Request ephemeral-storage to ensure the pod gets scheduled on a node with enough disk,
  # and set a limit to prevent the pod from being evicted by the kubelet.
  # In stream mode, no local disk is needed (data flows through memory to S3).
  resources:
    requests:
      cpu: "4"
      memory: "64Gi"
    limits:
      memory: "64Gi"
  parameters:
    mode: xet # Transfer mode: xet or stream
    transferClient: crt # S3 upload client: crt (AWS CRT, faster) or default (classic threading)
    fileWorkers: 4 # Number of files to transfer concurrently
    uploadWorkers: 16 # Parallel S3 upload threads per file
    downloadWorkers: 16 # Parallel range-request downloads per file (stream mode)
    downloadChunkSize: 16 # Download chunk size in MB (stream mode)
    partSize: 16 # S3 multipart upload part size in MB
    progressInterval: 10 # Seconds between progress log lines
    tempDir: /tmp/hf_sync # Local temp directory (xet mode)
    force: false # Re-upload all files ignoring sync check

# serviceAccountName to use for deployments
serviceAccountName: default

# Service configuration
service:
  type: ClusterIP
  port: 8000
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# NIM Operator defaults (framework: nim-operator)
# Model-specific values files override what differs.
# Helm deep-merges these with per-model values, so templates always use .Values.nimCache / .Values.nimService.

nimCache:
  enabled: false
  source:
    ngc:
      pullSecret: ngc-secret
      authSecret: ngc-api
  storage:
    pvc:
      create: true
      storageClass: efs-sc-dynamic
      size: "50Gi"
      volumeAccessMode: ReadWriteMany

nimService:
  enabled: false
  image:
    pullPolicy: IfNotPresent
  authSecret: ngc-api
  replicas: 1

hfTokenSecret:
  name: hf-token # Name of the Kubernetes secret
  key: token # Key within the secret containing the token (used when envFrom: false)
  envFrom: false # Set to true to use envFrom (secret must have HF_TOKEN as a key)
