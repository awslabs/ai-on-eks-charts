{{- if .Values.s3ModelCopy.model }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-copy-configmap
  namespace: {{ .Values.s3ModelCopy.namespace }}
  labels:
    app.kubernetes.io/name: s3-model-copy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: s3-model-copy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- include "inference-charts.extraLabels" . | nindent 4 }}
data:
  hf_s3_sync.py: |
{{ .Files.Get "files/hf_s3_sync.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "inference-charts.s3ModelCopyName" . }}
  namespace: {{ .Values.s3ModelCopy.namespace }}
  labels:
    app.kubernetes.io/name: s3-model-copy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: s3-model-copy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- include "inference-charts.extraLabels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-model-copy
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: s3-model-copy
        {{- include "inference-charts.extraLabels" . | nindent 8 }}
    spec:
      serviceAccountName: "{{ if .Values.s3ModelCopy.serviceAccountName }}{{ .Values.s3ModelCopy.serviceAccountName }}{{ else }}{{ .Values.serviceAccountName }}{{ end }}"
      {{- with .Values.s3ModelCopy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.s3ModelCopy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "inference-charts.s3ModelCopyAffinity" . | indent 6 }}
      terminationGracePeriodSeconds: {{ .Values.s3ModelCopy.terminationGracePeriodSeconds | default 120 }}
      containers:
        - name: s3copy
          image: public.ecr.aws/amazonlinux/amazonlinux:2023
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Installing dependencies..."
              dnf install -y python3.11 python3.11-pip --quiet
              pip3.11 install --quiet boto3[crt] requests huggingface_hub hf_xet hf_transfer

              echo "Starting sync..."
              exec python3.11 -u /app/hf_s3_sync.py \
                "{{ .Values.s3ModelCopy.model }}" \
                "{{ .Values.s3ModelCopy.s3Bucket }}" \
                {{ include "inference-charts.s3ModelCopyParameters" . }}
          {{- if .Values.s3ModelCopy.hfTokenSecret.envFrom }}
          envFrom:
            - secretRef:
                name: {{ .Values.s3ModelCopy.hfTokenSecret.name }}
          {{- end }}
          env:
            {{- if not .Values.s3ModelCopy.hfTokenSecret.envFrom }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3ModelCopy.hfTokenSecret.name }}
                  key: {{ .Values.s3ModelCopy.hfTokenSecret.key }}
            {{- end }}
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            {{- if eq (.Values.s3ModelCopy.parameters.mode | default "xet") "xet" }}
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            {{- end }}
            {{- with .Values.s3ModelCopy.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - mountPath: /app/hf_s3_sync.py
              name: script
              subPath: hf_s3_sync.py
          resources:
            {{- include "inference-charts.s3ModelCopyResources" . | nindent 12 }}
      restartPolicy: Never
      volumes:
        - name: script
          configMap:
            name: s3-copy-configmap
  backoffLimit: 4
{{- end }}
