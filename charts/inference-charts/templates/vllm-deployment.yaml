{{- if or (eq .Values.inference.framework "vllm") (eq .Values.inference.framework "aibrix") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.inference.serviceName}}
  namespace: {{.Values.inference.serviceNamespace}}
  labels:
    "app.kubernetes.io/component": "{{.Values.inference.serviceName}}"
    {{- if eq .Values.inference.framework "aibrix" }}
    model.aibrix.ai/name: "{{.Values.inference.serviceName}}"
    {{- end }}
    {{- include "inference-charts.extraLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.inference.modelServer.deployment.replicas }}
  selector:
    matchLabels:
      "app.kubernetes.io/component": "{{.Values.inference.serviceName}}"
      {{- if eq .Values.inference.framework "aibrix" }}
      model.aibrix.ai/name: "{{.Values.inference.serviceName}}"
      {{- end }}
  template:
    metadata:
      labels:
        "app.kubernetes.io/component": "{{.Values.inference.serviceName}}"
        {{- if eq .Values.inference.framework "aibrix" }}
        model.aibrix.ai/name: "{{.Values.inference.serviceName}}"
        {{- end }}
        {{- include "inference-charts.extraLabels" . | nindent 8 }}
    spec:
      containers:
        - name: main
          image: "{{ .Values.inference.modelServer.image.repository }}:{{ .Values.inference.modelServer.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - vllm serve {{ .Values.modelPath | default .Values.model }} {{ include "inference-charts.modelParameters" .  }}
          {{- if .Values.hfTokenSecret.envFrom }}
          envFrom:
            - secretRef:
                name: {{ .Values.hfTokenSecret.name }}
          {{- end }}
          env:
          {{- range $key, $value := .Values.inference.modelServer.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
            {{- if eq .Values.inference.accelerator "graviton" }}
            {{- $kvCacheSpace := include "inference-charts.vllmCpuKvCacheSpace" . }}
            {{- if $kvCacheSpace }}
            - name: VLLM_CPU_KVCACHE_SPACE
              value: {{ $kvCacheSpace | quote }}
            {{- end }}
            {{- end }}
            {{- if not .Values.hfTokenSecret.envFrom }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hfTokenSecret.name }}
                  key: {{ .Values.hfTokenSecret.key }}
            {{- end }}
          ports:
            - containerPort: 8000
              name: http
          resources:
            {{- include "inference-charts.acceleratorResources" . | nindent 12 }}
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
          startupProbe:
            {{- toYaml .Values.inference.modelServer.deployment.startupProbe | nindent 12 }}
          {{- with .Values.inference.modelServer.deployment.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.inference.modelServer.deployment.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.inference.modelServer.deployment.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.inference.modelServer.deployment.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if eq .Values.inference.accelerator "neuron" }}
      schedulerName: my-scheduler
      {{- end }}
      {{- if or (eq .Values.inference.accelerator "neuron") .Values.inference.modelServer.deployment.tolerations }}
      tolerations:
        {{- if eq .Values.inference.accelerator "neuron" }}
        - key: "aws.amazon.com/neuron"
          operator: "Exists"
          effect: "NoSchedule"
        {{- end }}
        {{- with .Values.inference.modelServer.deployment.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if .Values.inference.modelServer.deployment.instanceType }}
      nodeSelector:
        node.kubernetes.io/instance-type: {{ .Values.inference.modelServer.deployment.instanceType }}
      {{- end }}
      {{- if and .Values.inference.modelServer.deployment.topologySpreadConstraints.enabled .Values.inference.modelServer.deployment.topologySpreadConstraints.constraints }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              "app.kubernetes.io/component": "{{$.Values.inference.serviceName}}"
              {{- if eq .Values.inference.framework "aibrix" }}
              model.aibrix.ai/name: "{{.Values.inference.serviceName}}"
              {{- end }}
      {{- end }}
      {{- $podAffinityEnabled := and .Values.inference.modelServer.deployment.podAffinity.enabled .Values.inference.modelServer.deployment.podAffinity.preferredDuringSchedulingIgnoredDuringExecution }}
      {{- $graviton := eq .Values.inference.accelerator "graviton" }}
      {{- if or $podAffinityEnabled $graviton }}
      affinity:
        {{- if $graviton }}
        {{- include "inference-charts.gravitonNodeAffinity" . | nindent 8 }}
        {{- end }}
        {{- if $podAffinityEnabled }}
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- range .Values.inference.modelServer.deployment.podAffinity.preferredDuringSchedulingIgnoredDuringExecution }}
            - weight: {{ .weight }}
              podAffinityTerm:
                topologyKey: {{ .podAffinityTerm.topologyKey }}
                labelSelector:
                  matchLabels:
                    "app.kubernetes.io/component": "{{$.Values.inference.serviceName}}"
                    {{- if eq $.Values.inference.framework "aibrix" }}
                    model.aibrix.ai/name: "{{$.Values.inference.serviceName}}"
                    {{- end }}
            {{- end }}
        {{- end }}
      {{- end }}
      volumes:
      {{- if .Values.inference.modelServer.deployment.sharedMemory }}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: {{ .Values.inference.modelServer.deployment.sharedMemory }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccountName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{.Values.inference.serviceName}}
  namespace: {{.Values.inference.serviceNamespace}}
  labels:
    {{- include "inference-charts.extraLabels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    "app.kubernetes.io/component": "{{.Values.inference.serviceName}}"
    {{- if eq .Values.inference.framework "aibrix" }}
    model.aibrix.ai/name: "{{.Values.inference.serviceName}}"
    {{- end }}
{{- end }}
