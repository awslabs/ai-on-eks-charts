suite: benchmark service account ownership
templates:
  - templates/serviceaccount.yaml
tests:
  - it: does not try to adopt a preexisting IRSA account
    set:
      benchmark.serviceAccount.create: false
      benchmark.serviceAccount.name: inference-perf-sa
    asserts:
      - hasDocuments:
          count: 0

  - it: creates the Job account in the benchmark namespace for a fresh install
    asserts:
      - equal:
          path: metadata.namespace
          value: benchmarking
      - notEqual:
          path: metadata.name
          value: inference-perf-sa
      - matchRegex:
          path: metadata.name
          pattern: '-sa$'
