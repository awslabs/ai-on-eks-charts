# Default values for benchmark-charts

# Benchmarking Configuration
benchmark:
  # Enable benchmarking
  enabled: true

  # Namespace for benchmark jobs
  namespace: benchmarking

  # Benchmark image configuration
  image:
    repository: quay.io/inference-perf/inference-perf
    tag: v0.6.1
    pullPolicy: IfNotPresent

  # By default Helm creates a release-specific account. To use a preexisting
  # account (for example, one with IRSA), set create: false and its name.
  serviceAccount:
    create: true
    name: ""
    annotations: {}

  # Optional complete inference-perf config.yml (native snake_case keys). When set,
  # replaces the scenario-generated config rather than merging with it. For example:
  # config:
  #   load:
  #     type: concurrent
  #     stages:
  #       - concurrency_level: 8
  #         num_requests: 40
  #   data:
  #     type: synthetic
  #     input_distribution: {type: fixed, min: 512, max: 512, mean: 512, std_dev: 0}
  #     output_distribution: {type: fixed, min: 128, max: 128, mean: 128, std_dev: 0}
  #   storage:
  #     local_storage:
  #       path: /tmp/reports  # use a fixed directory to include JSON in pod logs
  # Supply api, server, tokenizer and any report settings in the same config map.
  config: null
  scenario: baseline

  # Job configuration
  job:
    backoffLimit: 2
    ttlSecondsAfterFinished: 3600

  # Target inference server configuration
  target:
    # Server type: vllm, openai, etc.
    serverType: vllm
    # Model name identifier
    modelName: qwen3-8b
    # Full URL to the inference endpoint
    baseUrl: http://qwen3-vllm.default:8000
    # Tokenizer model path (Hugging Face model ID)
    tokenizerPath: Qwen/Qwen3-8B
    # Ignore EOS tokens
    ignoreEos: true

  # API configuration
  api:
    type: completion
    streaming: true

  # Generated scenarios write JSON reports locally; S3 upload is opt-in.
  storage:
    s3:
      bucketName: ""
      # S3 key prefix; chart appends scenario, server, model and a unique suffix.
      pathPrefix: "benchmark-results"

  # Model dependencies to install
  dependencies:
    packages: []

  # Resource allocation for benchmark pods
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  # Pod scheduling constraints (for example, select and tolerate tainted CPU nodes).
  nodeSelector: {}
  tolerations: []

  # Optional, soft same-zone placement near inference pods. Match the inference
  # chart's app.kubernetes.io/component label and set namespaces for its namespace.
  affinity:
    enabled: false
    targetLabels:
      app.kubernetes.io/component: inference
    namespaces:
      - default

  # Scenario-specific configurations
  scenarios:
    # SCENARIO 1: Baseline Performance
    baseline:
      description: "Establish optimal performance with zero contention"
      data:
        input:
          mean: 512
          stdDev: 0
          min: 512
          max: 512
        output:
          mean: 128
          stdDev: 0
          min: 128
          max: 128
      load:
        type: constant
        numWorkers: 4
        stages:
          - rate: 1
            duration: 300

    # SCENARIO 2: Saturation Testing
    saturation:
      description: "Determine maximum sustainable throughput"
      data:
        input:
          mean: 512
          stdDev: 128
          min: 128
          max: 2048
        output:
          mean: 256
          stdDev: 64
          min: 32
          max: 512
      load:
        type: constant
        numWorkers: 8
        stages:
          - rate: 5
            duration: 180
          - rate: 10
            duration: 180
          - rate: 20
            duration: 180
          - rate: 40
            duration: 180

    # SCENARIO 3: Automatic Saturation Detection
    sweep:
      description: "Automated capacity discovery with intelligent staging"
      data:
        input:
          mean: 512
          stdDev: 128
          min: 128
          max: 2048
        output:
          mean: 256
          stdDev: 64
          min: 32
          max: 512
      load:
        type: constant
        numWorkers: 8
        stages: []  # Auto-generated
        sweep:
          type: geometric
          numRequests: 2000
          timeout: 60
          numStages: 5
          stageDuration: 180
          saturationPercentile: 95

    # SCENARIO 4: Production Simulation
    production:
      description: "Realistic traffic with variable sizes and bursty arrivals"
      data:
        input:
          mean: 1024
          stdDev: 512
          min: 128
          max: 4096
        output:
          mean: 512
          stdDev: 256
          min: 50
          max: 2048
      load:
        type: poisson  # Realistic bursty arrivals
        numWorkers: 8
        stages:
          - rate: 15
            duration: 600
