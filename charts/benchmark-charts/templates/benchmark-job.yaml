{{- if .Values.benchmark.enabled }}
{{- $scenario := index .Values.benchmark.scenarios .Values.benchmark.scenario | default dict }}
{{- $reportPath := "/tmp/reports" }}
{{- if kindIs "map" .Values.benchmark.config }}
  {{- $reportPath = "" }}
  {{- with .Values.benchmark.config.storage }}
    {{- with .local_storage }}
      {{- $reportPath = .path | default "" }}
    {{- end }}
  {{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "benchmark-charts.fullname" . }}-{{ .Values.benchmark.scenario }}
  namespace: {{ .Values.benchmark.namespace }}
  labels:
    {{- include "benchmark-charts.labels" . | nindent 4 }}
    app.kubernetes.io/component: benchmark
    benchmark.scenario: {{ .Values.benchmark.scenario }}
  {{- if not (kindIs "map" .Values.benchmark.config) }}
  annotations:
    benchmark.description: {{ $scenario.description | quote }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.benchmark.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.benchmark.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "benchmark-charts.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: benchmark
        benchmark.scenario: {{ .Values.benchmark.scenario }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "benchmark-charts.serviceAccountName" . }}

      {{- with .Values.benchmark.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.benchmark.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.benchmark.affinity.enabled }}
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  {{- toYaml .Values.benchmark.affinity.targetLabels | nindent 18 }}
              {{- with .Values.benchmark.affinity.namespaces }}
              namespaces:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              topologyKey: topology.kubernetes.io/zone
      {{- end }}

      containers:
      - name: inference-perf
        image: {{ .Values.benchmark.image.repository }}:{{ .Values.benchmark.image.tag }}
        imagePullPolicy: {{ .Values.benchmark.image.pullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          {{- if .Values.benchmark.dependencies.packages }}
          echo "Installing dependencies..."
          pip install --no-cache-dir \
          {{- range .Values.benchmark.dependencies.packages }}
            {{ . | quote }} \
          {{- end }}
            && echo "Dependencies installed successfully"
          {{- end }}
          {{- if kindIs "map" .Values.benchmark.config }}
          echo "Starting inference-perf with custom configuration"
          {{- else }}
          echo "=========================================="
          echo "Starting {{ .Values.benchmark.scenario | upper }} Performance Test"
          echo "Description: {{ $scenario.description }}"
          echo "Target: {{ .Values.benchmark.target.baseUrl }}"
          echo "Model: {{ .Values.benchmark.target.modelName }}"
          echo "=========================================="
          {{- end }}
          inference-perf --config_file /workspace/config.yml
          status=$?
          {{- if $reportPath }}
          for report in "$REPORT_PATH"/*.json; do
            [ -f "$report" ] || continue
            printf '\n--- %s ---\n' "$report"
            cat "$report"
            printf '\n'
          done
          {{- end }}
          exit "$status"
        env:
        - name: BENCHMARK_SCENARIO
          value: {{ .Values.benchmark.scenario | quote }}
        {{- if $reportPath }}
        - name: REPORT_PATH
          value: {{ $reportPath | quote }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /workspace/config.yml
          subPath: config.yml
        resources:
          {{- toYaml .Values.benchmark.resources | nindent 10 }}

      volumes:
      - name: config
        configMap:
          name: {{ include "benchmark-charts.fullname" . }}-{{ .Values.benchmark.scenario }}
{{- end }}
